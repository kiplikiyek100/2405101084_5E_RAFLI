<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Masuk - Dhone</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a class="logo" href="home.html">Dhone.com</a>
      </div>
    </nav>
    <main class="container">
      <form class="form-box" onsubmit="loginForm(event)">
        <h1>Masuk</h1>
        <p class="form-note">Masuk untuk melihat pesanan kamu.</p>
        <div class="form-group">
          <label>Email</label
          ><input type="email" required placeholder="nama@email.com" />
        </div>
        <div class="form-group">
          <label>Kata Sandi</label
          ><input type="password" required placeholder="Masukkan kata sandi" />
        </div>
        <button class="btn" style="width: 100%">Masuk</button>
        <p class="form-note">
          Belum punya akun?
          <a href="register.html" style="color: #6c3cc9">Daftar di sini</a>
        </p>
      </form>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
</html>
