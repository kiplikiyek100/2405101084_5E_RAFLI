<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Masuk - Dhone</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container nav-wrap">
        <a class="logo" href="index.html">Dhone.com</a>
        <div class="menu">
          <a href="index.html">Beranda</a><a href="konser.html">Event</a><a href="jasa-eo.html">Jasa EO</a><a href="riwayat.html">Pesanan</a
          ><a class="btn btn-small" href="login.html" aria-current="page">Masuk</a>
        </div>
      </div>
    </nav>
    <main class="container">
      <form class="form-box" onsubmit="loginForm(event)">
        <h1 id="login-title">Masuk</h1>
        <p id="login-description" class="form-note">Masuk untuk membeli tiket dan melihat pesanan kamu.</p>
        <div class="form-group">
          <label>Email</label
          ><input type="email" required placeholder="nama@email.com" />
        </div>
        <div class="form-group">
          <label>Kata Sandi</label
          ><input type="password" required placeholder="Masukkan kata sandi" />
        </div>
        <button class="btn" style="width: 100%">Masuk</button>
        <p class="form-note">
          Belum punya akun?
          <a href="register.html" style="color: #6c3cc9">Daftar di sini</a>
        </p>
        <p id="login-switch" class="form-note login-admin-link">
          Administrator? <a href="login.html?admin=1">Login sebagai admin</a>
        </p>
      </form>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
</html>
