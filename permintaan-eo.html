<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Permintaan EO - Dhone</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a class="logo" href="index.html">Dhone.com</a>
      </div>
    </nav>
    <main class="container">
      <form class="form-box" onsubmit="kirimPermintaanEO(event)">
        <h1>Permintaan Jasa EO</h1>
        <p class="form-note">
          Ceritakan kebutuhan acara kamu, admin kami akan segera menghubungi.
        </p>
        <div class="form-group">
          <label>Nama</label><input id="eo-nama" required />
        </div>
        <div class="form-group">
          <label>Nomor HP</label><input id="eo-hp" required />
        </div>
        <div class="form-group">
          <label>Jenis Acara</label
          ><select id="eo-acara">
            <option>Ulang Tahun</option>
            <option>Gathering</option>
            <option>Konser</option>
            <option>Lainnya</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tanggal Acara</label
          ><input id="eo-tanggal" type="date" required />
        </div>
        <div class="form-group">
          <label>Detail Kebutuhan</label
          ><textarea
            id="eo-detail"
            rows="4"
            required
            placeholder="Contoh: acara ulang tahun 100 orang di Jakarta..."
          ></textarea>
        </div>
        <button class="btn" style="width: 100%">Kirim Permintaan</button>
      </form>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
</html>
