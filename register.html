<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Daftar - Dhone</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a class="logo" href="index.html">Dhone.com</a>
      </div>
    </nav>
    <main class="container">
      <form class="form-box" onsubmit="registerForm(event)">
        <h1>Buat Akun</h1>
        <div class="form-group">
          <label>Nama Lengkap</label><input id="nama" required />
        </div>
        <div class="form-group">
          <label>Email</label><input type="email" required />
        </div>
        <div class="form-group">
          <label>Nomor HP</label><input type="tel" required />
        </div>
        <div class="form-group">
          <label>Kata Sandi</label><input type="password" required />
        </div>
        <div class="form-group">
          <label>Konfirmasi Kata Sandi</label><input type="password" required />
        </div>
        <button class="btn" style="width: 100%">Daftar</button>
        <p class="form-note">
          Sudah punya akun?
          <a href="login.html" style="color: #6c3cc9">Masuk</a>
        </p>
      </form>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
</html>
